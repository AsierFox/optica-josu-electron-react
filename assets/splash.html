<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Cargango</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(100deg, #8798f0, #081c47);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
    }

    .container {
      text-align: center;
      animation: fadeIn 0.6s ease;
      margin-top: 40px;
    }

    .logo {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      color: #c4c4c4;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #2f54eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo"><img src="./optica-josu-logo.png" width="300" /></div>
    <div class="spinner"></div>
    <div class="logo">Cargando Aplicación...</div>
  </div>
</body>

</html>
